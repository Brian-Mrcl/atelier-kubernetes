# Exercice 4 — La page HTML de votre site, stockée dans le cluster.
# Une ConfigMap contient de la configuration (ou de petits fichiers) séparée de l'image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
data:
  # Chaque clé devient un fichier quand la ConfigMap est montée comme volume.
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head><meta charset="utf-8"><title>Mon site sur Kubernetes</title></head>
      <body>
        <h1>Bienvenue sur mon site Kubernetes !</h1>
        <h2>Atelier Kubernetes 2026</h2>

        <p>Auteur : Brian-Mrcl</p>
        <p>Groupe : Ing2-RS3 Promo 2028</p>

        <p>Ce site est hébergé sur un cluster Kubernetes.</p>

        <p>La page HTML est stockée dans une ConfigMap
        et servie par un conteneur nginx.</p>
        <p>Servi par Kubernetes.</p>
        <p> Modification TEST </p>
      </body>
    </html>
